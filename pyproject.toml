[project]
name = "nmmc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pulp>=3.3.2",
    "scipy>=1.18.1",
]

[project.scripts]
prob1 = "nmmc.cli.prob1:main"
prob2 = "nmmc.cli.prob2:main"
prob3 = "nmmc.cli.prob3:main"
prob4 = "nmmc.cli.prob4:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nmmc"]
